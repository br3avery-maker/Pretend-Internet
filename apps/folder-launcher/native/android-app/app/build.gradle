plugins { id 'com.android.application' }

def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file('keystore.properties')
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}

def releaseStoreFile = releaseSigningProperties.getProperty('storeFile') ?: System.getenv('FOLDER_LAUNCHER_KEYSTORE_FILE')
def releaseStorePassword = releaseSigningProperties.getProperty('storePassword') ?: System.getenv('FOLDER_LAUNCHER_STORE_PASSWORD')
def releaseKeyAlias = releaseSigningProperties.getProperty('keyAlias') ?: System.getenv('FOLDER_LAUNCHER_KEY_ALIAS')
def releaseKeyPassword = releaseSigningProperties.getProperty('keyPassword') ?: System.getenv('FOLDER_LAUNCHER_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every {
    it != null && !it.trim().isEmpty()
}

android {
    namespace 'xyz.chaoticka.folderlauncher'
    compileSdk 35
    defaultConfig {
        applicationId 'xyz.chaoticka.folderlauncher'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            // Never fall back to the debug key: that would not be a stable update identity.
        }
    }
}

afterEvaluate {
    tasks.named('preReleaseBuild').configure {
        doFirst {
            if (!hasReleaseSigning) {
                throw new GradleException(
                    'Release signing is not configured. Run ' +
                    'apps/folder-launcher/native/android-app/setup-release-signing.sh once, or set ' +
                    'FOLDER_LAUNCHER_KEYSTORE_FILE, FOLDER_LAUNCHER_STORE_PASSWORD, ' +
                    'FOLDER_LAUNCHER_KEY_ALIAS and FOLDER_LAUNCHER_KEY_PASSWORD. ' +
                    'See apps/folder-launcher/RELEASING.md.'
                )
            }
        }
    }
}
