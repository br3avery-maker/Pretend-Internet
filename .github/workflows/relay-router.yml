name: Relay-router routing, protocol boundary and demo checks
on:
  push:
    branches: [main]
    paths:
      - 'tools/relay-router/**'
      - 'tools/test-support/**'
      - '.github/workflows/relay-router.yml'
  pull_request:
    paths:
      - 'tools/relay-router/**'
      - 'tools/test-support/**'
      - '.github/workflows/relay-router.yml'
jobs:
  relay-router:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            tools/test-support/package-lock.json
            tools/relay-router/package-lock.json
      - name: Install pinned shared relay fixture and router dependencies
        run: |
          npm ci --prefix tools/test-support --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/relay-router --ignore-scripts --no-audit --no-fund
      - name: Verify universal routing and protocol boundaries
        working-directory: tools/relay-router
        run: |
          npm test
          node test/mutation.mjs
          node demo.mjs
