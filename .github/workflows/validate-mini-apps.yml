name: Mini-app metadata and frontend build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Validate mini-app metadata
        run: |
          python3 scripts/validate-mini-app.py templates/mini-app
          for f in apps/*/app.json; do
            [ -f "$f" ] || continue
            python3 scripts/validate-mini-app.py "$(dirname "$f")"
          done
      - name: Verify shell-only build
        run: |
          sh scripts/build-frontend.sh
          sh scripts/check-frontend.sh
      - name: Verify on-device npm build command
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run check
      - name: Verify Folder Launcher source contract and browser regressions
        run: |
          python3 apps/folder-launcher/tests/test_source_contract.py
          node --check apps/folder-launcher/tests/launcher.js
          node --test apps/folder-launcher/tests/test_*.js
