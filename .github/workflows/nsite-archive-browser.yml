name: Nsite archive unit, build and browser pipeline checks
on:
  push:
    paths: ['apps/nsite-archive/**', '.github/workflows/nsite-archive-browser.yml']
  pull_request:
    paths: ['apps/nsite-archive/**', '.github/workflows/nsite-archive-browser.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/nsite-archive/package-lock.json
      - name: Install pinned browser-test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/nsite-archive
      - name: Unit tests, build output and script syntax
        run: |
          npm test
          sh build.sh
          for f in *.js pages/*.js; do node --check "$f"; done
        working-directory: apps/nsite-archive
      - name: Install test browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/nsite-archive
      - name: Run test/pipeline.html in Chromium (fixture phases only)
        run: npm run test:pipeline
        working-directory: apps/nsite-archive
